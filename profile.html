<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f7">
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/profile.css">
    <script src="assets/js/shared.js" defer></script>
    <script src="assets/js/profile.js" defer></script>
</head>

<body data-page="profile">
    <header class="mobile-header"><a class="brand" href="index.html"><span class="brand-mark"></span><span
                class="brand-word"></span></a><a class="avatar avatar-small" href="profile.html"></a></header>
    <div class="app-shell">
        <aside class="left-rail"><a class="brand" href="index.html"><span class="brand-mark"></span><span
                    class="brand-word"></span></a>
            <nav class="primary-nav" aria-label="Main navigation"><a class="nav-link" href="index.html"><span
                        class="nav-icon"><i class="fa-regular fa-house"></i></span>Home</a><a class="nav-link"
                    href="explore.html"><span class="nav-icon"><i class="fa-brands fa-sistrix"></i></span>Explore</a><a
                    class="nav-link" href="community.html"><span class="nav-icon"><i
                            class="fa-solid fa-users"></i></span>Community</a><a class="nav-link"
                    href="chats.html"><span class="nav-icon"><i class="fa-regular fa-comments"></i></span>Chats</a><a
                    class="nav-link" href="bookmarks.html"><span class="nav-icon"><i
                            class="fa-regular fa-bookmark"></i></span>Bookmarks</a><a class="nav-link"
                    href="notifications.html"><span class="nav-icon"><i
                            class="fa-regular fa-bell"></i></span>Notifications<span class="nav-badge"
                        data-notification-count></span></a><a class="nav-link active" href="profile.html"><span
                        class="nav-icon"><i class="fa-regular fa-user"></i></span>Profile</a><a class="nav-link"
                    href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a>
            </nav>
            <div class="rail-divider"></div>
            <div class="rail-bottom">
                <div class="mini-profile"><a class="avatar" href="profile.html"></a><a class="profile-summary"
                        href="profile.html"><strong></strong><span></span></a><button class="icon-button"
                        data-action="account-menu" aria-label="Account options">···</button></div><a class="text-link"
                    href="login.html">Switch account</a>
            </div>

        </aside>


        <main class="main-column">
            <div class="page-heading profile-page-heading"><a class="back-button" href="index.html"
                    aria-label="Back to home">←</a>
                <div>
                    <h1 data-profile-name></h1>
                    <p class="subtle" data-profile-post-count></p>
                </div>
            </div>
            <div class="profile-cover" role="img" aria-label="Soft green landscape cover"></div>
            <section class="profile-info">
                <div class="profile-actions">
                    <div class="avatar avatar-xl" data-profile-avatar>M</div>
                    <div class="profile-header-actions"><button class="icon-button" type="button"
                            data-action="user-options" data-user-name=""
                            aria-label="Profile options">···</button><button class="button button-secondary"
                            data-action="edit-profile">Edit profile</button></div>
                </div>
                <h2 data-profile-full-name></h2>
                <p class="profile-handle" data-profile-handle></p>
                <p class="profile-bio" data-profile-bio></p>
                <div class="profile-meta"><span data-profile-location></span><span data-profile-joined></span></div>
                <div class="profile-counts"><button type="button" data-action="show-connections"
                        data-connection="following" aria-label="Show following"><strong data-following-total></strong>
                        Following</button><button type="button" data-action="show-connections"
                        data-connection="followers" aria-label="Show followers"><strong data-followers-total></strong>
                        Followers</button><button type="button" data-action="show-connections" data-connection="friends"
                        aria-label="Show friends"><strong data-friends-total></strong> Friends</button></div>
            </section>
            <div class="feed-tabs profile-tabs" role="tablist"><button class="feed-tab active"
                    data-profile-tab="posts">Posts</button><button class="feed-tab"
                    data-profile-tab="replies">Replies</button><button class="feed-tab"
                    data-profile-tab="reposts">Reposts</button><button class="feed-tab"
                    data-profile-tab="likes">Likes</button></div>
            <section class="profile-content" data-profile-content="posts">
                <div class="feed-list" data-feed-list></div>
            </section>
            <section class="profile-content hidden" data-profile-content="replies">
                <div class="feed-list" data-profile-feed="replies"></div>
                <div class="empty-state profile-empty-state hidden" data-profile-empty="replies"><span
                        class="empty-symbol">◯</span>
                    <h2>No replies yet</h2>
                    <p>Posts you have replied to will appear here.</p>
                </div>
            </section>
            <section class="profile-content hidden" data-profile-content="reposts">
                <div class="feed-list" data-profile-feed="reposts"></div>
                <div class="empty-state profile-empty-state hidden" data-profile-empty="reposts"><span
                        class="empty-symbol">↻</span>
                    <h2>No reposts yet</h2>
                    <p>Posts you repost will appear here.</p>
                </div>
            </section>
            <section class="profile-content hidden" data-profile-content="likes">
                <div class="feed-list" data-profile-feed="likes"></div>
                <div class="empty-state profile-empty-state hidden" data-profile-empty="likes"><span
                        class="empty-symbol">♡</span>
                    <h2>No likes yet</h2>
                    <p>Posts you like will appear here.</p>
                </div>
            </section>
        </main>

    </div>


    <nav class="mobile-nav" aria-label="Mobile navigation"><a href="index.html" aria-label="Home"><i
                class="fa-regular fa-house"></i></a><a href="explore.html" aria-label="Explore"><i
                class="fa-brands fa-sistrix"></i></a><a href="notifications.html" aria-label="Notifications"><i
                class="fa-regular fa-bell"></i></a><a class="active" href="profile.html" aria-label="Profile"><i
                class="fa-regular fa-user"></i></a>
    </nav>

</body>

</html>
