<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f7">
    <title>Gather — your people, in one place</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/home.css">
    <script src="assets/js/shared.js" defer></script>
    <script src="assets/js/home.js" defer></script>
</head>

<body data-page="home">
    <header class="mobile-header"><a class="brand" href="index.html"><span class="brand-mark"></span><span
                class="brand-word"></span></a><a class="avatar avatar-small" href="profile.html"
            aria-label="Your profile"></a></header>
    <div class="app-shell">
        <aside class="left-rail">
            <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-word"></span></a>
            <nav class="primary-nav" aria-label="Main navigation">
                <a class="nav-link active" href="index.html"><span class="nav-icon"><i
                            class="fa-solid fa-house"></i></span>Home</a>
                <a class="nav-link" href="explore.html"><span class="nav-icon"><i
                            class="fa-brands fa-sistrix"></i></span>Explore</a>
                <a class="nav-link" href="community.html"><span class="nav-icon"><i
                            class="fa-solid fa-users"></i></span>Community</a>
                <a class="nav-link" href="chats.html"><span class="nav-icon"><i
                            class="fa-regular fa-comments"></i></span>Chats</a>
                <a class="nav-link" href="bookmarks.html"><span class="nav-icon"><i
                            class="fa-regular fa-bookmark"></i></span>Bookmarks</a>
                <a class="nav-link" href="notifications.html"><span class="nav-icon"><i
                            class="fa-regular fa-bell"></i></span>Notifications<span class="nav-badge"
                        data-notification-count></span></a>
                <a class="nav-link" href="profile.html"><span class="nav-icon"><i
                            class="fa-regular fa-user"></i></span>Profile</a><a class="nav-link"
                    href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a>
            </nav>
            <div class="rail-divider"></div>
            <div class="rail-bottom">
                <div class="mini-profile"><a class="avatar" href="profile.html"></a><a class="profile-summary"
                        href="profile.html"><strong></strong><span></span></a><button class="icon-button"
                        data-action="account-menu" aria-label="Account options">···</button></div><a class="text-link"
                    href="login.html">Switch account</a>
            </div>
        </aside>

    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation"><a class="active" href="index.html" aria-label="Home"><i
                class="fa-regular fa-house"></i></a><a href="explore.html" aria-label="Explore"><i
                class="fa-brands fa-sistrix"></i></a><a href="notifications.html" aria-label="Notifications"><i
                class="fa-regular fa-bell"></i></a><a href="profile.html" aria-label="Profile"><i
                class="fa-regular fa-user"></i></a></nav>
    <dialog class="modal" data-modal>
        <form method="dialog" class="modal-content"><button class="modal-close" type="button" data-action="close-dialog"
                aria-label="Close">×</button>
            <h2>Create a community</h2>
            <p class="modal-copy">Give your people a place to find each other.</p><label class="field-label">Community
                name<input name="community-name" maxlength="32" required placeholder="Community name"></label><label
                class="field-label">A short description<textarea name="community-description" maxlength="120" rows="3"
                    placeholder="What brings this community together?"></textarea></label><label
                class="field-label">Card art<input name="card-art" type="file" accept="image/*"
                    data-card-art-file></label>
            <div class="card-art-banner" data-card-art-banner hidden></div>
            <p class="photo-notice" data-card-art-notice role="status"></p><button class="button button-primary"
                data-action="submit-community">Create community</button>
        </form>
    </dialog>
</body>

</html>
