<!doctype html>
<html lang="en">


<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f7">
  <title>Bookmarks — Gather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/bookmarks.css">

  <script src="assets/js/bookmarks.js" defer></script>
</head>


<body data-page="bookmarks">
    <header class="mobile-header"><a class="brand" href="home.html"><span class="brand-mark"></span><span
                class="brand-word"></span></a><button class="icon-button" type="button" data-action="toggle-account-nav" aria-expanded="false" aria-controls="mobile-account-nav" aria-label="Account menu"><i class="fa-solid fa-ellipsis"></i></button></header>
    <div class="mobile-account">
        <button class="mobile-account-backdrop" type="button" data-action="close-account-nav" aria-label="Close account menu"></button>
        <nav class="mobile-account-nav" id="mobile-account-nav" aria-label="Account">
            <p class="rail-heading">Account</p>
            <a class="nav-link" href="profile.html"><span class="nav-icon"><i class="fa-regular fa-user"></i></span>Profile</a>
            <a class="nav-link" href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a>
        </nav>
    </div>
    <div class="app-shell">
        <aside class="left-rail">
            <a class="brand" href="home.html"><span class="brand-mark"></span><span class="brand-word"></span></a>
            <nav class="primary-nav" aria-label="Main navigation">
                <a class="nav-link" href="home.html"><span class="nav-icon"><i
                            class="fa-solid fa-house"></i></span>Home</a>
                <a class="nav-link" href="explore.html"><span class="nav-icon"><i
                            class="fa-brands fa-sistrix"></i></span>Explore</a>
                <a class="nav-link" href="community.html"><span class="nav-icon"><i
                            class="fa-solid fa-users"></i></span>Community</a>
                <a class="nav-link" href="chats.html"><span class="nav-icon"><i
                            class="fa-regular fa-comments"></i></span>Chats</a>
                <a class="nav-link active" href="bookmarks.html"><span class="nav-icon"><i
                            class="fa-regular fa-bookmark"></i></span>Bookmarks</a>
                <a class="nav-link" href="notifications.html"><span class="nav-icon"><i
                            class="fa-regular fa-bell"></i></span>Notifications<span class="nav-badge"
                        data-notification-count></span></a>
                <a class="nav-link" href="profile.html"><span class="nav-icon"><i
                            class="fa-regular fa-user"></i></span>Profile</a><a class="nav-link"
                    href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a>
                <a class="nav-link admin-nav-link hidden" href="admin.html"><span class="nav-icon"><i class="fa-solid fa-shield-halved"></i></span>Admin</a>
            </nav>
            <div class="rail-divider"></div>
            <div class="rail-bottom">
                <div class="mini-profile"><a class="avatar" href="profile.html"></a><a class="profile-summary"
                        href="profile.html"><strong></strong><span></span></a><button class="icon-button"
                        data-action="account-menu" aria-label="Account options">···</button></div><a class="text-link"
                    href="login.html">Switch account</a>
            </div>
        </aside>


        <main class="main-column">
            <div class="page-heading">
                <div>
                    <h1>Bookmarks</h1>
                </div>
            </div>
            <div class="feed-list" data-feed-list></div>
            <div class="empty-state hidden" data-empty-feed><span class="empty-symbol">▱</span>
                <h2>No bookmarks yet</h2>
                <p>Save a post to keep it close for later.</p><a class="button button-secondary"
                    href="home.html">Browse your feed</a>
            </div>
        </main>


        <aside class="right-rail">
            <label class="search-box"><span>⌕</span><input type="search" placeholder="Search by name or username"
                    aria-label="Search people and communities" data-search-input><kbd>/</kbd></label>
            <div class="right-section search-results hidden" data-search-results></div>
            <section class="right-section request-section">
                <div class="section-title">
                    <h2>People to know</h2><a href="explore.html">See all</a>
                </div>
                <div data-suggestions></div>
            </section>
            <section class="right-section trends-section">
                <div class="section-title">
                    <h2>Growing communities</h2><a href="community.html">Explore</a>
                </div>
                <div data-trending-circles></div>
            </section>
            <footer class="site-footer"><a data-footer-link="about" href="#">About</a><a data-footer-link="guidelines"
                    href="#">Guidelines</a><a data-footer-link="privacy" href="#">Privacy</a><span
                    data-footer-copy></span></footer>
        </aside>


    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation"><a href="home.html" aria-label="Home"><i
                class="fa-solid fa-house"></i></a><a href="explore.html" aria-label="Explore"><i
                class="fa-brands fa-sistrix"></i></a><a href="notifications.html" aria-label="Notifications"><i
                class="fa-regular fa-bell"></i></a></nav>
</body>

</html>
