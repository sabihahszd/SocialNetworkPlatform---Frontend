<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f7">
    <title>Chats — Gather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/chats.css">

    <script src="assets/js/chats.js" defer></script>
</head>

<body data-page="chats">
    <header class="mobile-header">
        <a class="brand" href="home.html"><span class="brand-mark"></span><span class="brand-word"></span></a>
        <button class="icon-button" type="button" data-action="toggle-account-nav" aria-expanded="false" aria-controls="mobile-account-nav" aria-label="Account menu"><i class="fa-solid fa-ellipsis"></i></button>
    </header>
    <div class="mobile-account">
        <button class="mobile-account-backdrop" type="button" data-action="close-account-nav" aria-label="Close account menu"></button>
        <nav class="mobile-account-nav" id="mobile-account-nav" aria-label="Account">
            <p class="rail-heading">Account</p>
            <a class="nav-link" href="profile.html"><span class="nav-icon"><i class="fa-regular fa-user"></i></span>Profile</a>
            <a class="nav-link" href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a>
        </nav>
    </div>
    <div class="app-shell">
        <aside class="left-rail">
            <a class="brand" href="home.html"><span class="brand-mark"></span><span class="brand-word"></span></a>
            <nav class="primary-nav" aria-label="Main navigation">
                <a class="nav-link" href="home.html"><span class="nav-icon"><i
                            class="fa-solid fa-house"></i></span>Home</a>
                <a class="nav-link" href="explore.html"><span class="nav-icon"><i
                            class="fa-brands fa-sistrix"></i></span>Explore</a>
                <a class="nav-link" href="community.html"><span class="nav-icon"><i
                            class="fa-solid fa-users"></i></span>Community</a>
                <a class="nav-link active" href="chats.html"><span class="nav-icon"><i
                            class="fa-regular fa-comments"></i></span>Chats</a>
                <a class="nav-link" href="bookmarks.html"><span class="nav-icon"><i
                            class="fa-regular fa-bookmark"></i></span>Bookmarks</a>
                <a class="nav-link" href="notifications.html"><span class="nav-icon"><i
                            class="fa-regular fa-bell"></i></span>Notifications<span class="nav-badge"
                        data-notification-count></span></a>
                <a class="nav-link" href="profile.html"><span class="nav-icon"><i
                            class="fa-regular fa-user"></i></span>Profile</a><a class="nav-link"
                    href="settings.html"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a>
                <a class="nav-link admin-nav-link hidden" href="admin.html"><span class="nav-icon"><i class="fa-solid fa-shield-halved"></i></span>Admin</a>
            </nav>
            <div class="rail-divider"></div>
            <div class="rail-bottom">
                <div class="mini-profile">
                    <a class="avatar" href="profile.html"></a>
                    <a class="profile-summary" href="profile.html"><strong></strong><span></span></a>
                    <button class="icon-button" data-action="account-menu" aria-label="Account options">···</button>
                </div>
                <a class="text-link" href="login.html">Switch account</a>
            </div>
        </aside>


        <main class="main-column chats-main">
            <div class="chat-sidebar">
                <div class="chat-sidebar-heading">
                    <div>
                        <h1>Chats</h1>
                    </div>
                    <button class="icon-button" data-action="new-chat" aria-label="Start a new chat">＋</button>
                </div>
                <label class="search-box chat-search"><span>⌕</span><input type="search"
                        placeholder="Search conversations" aria-label="Search conversations" data-chat-search></label>
                <div class="chat-list" data-chat-list></div>
            </div>
            <section class="chat-thread" data-chat-thread>
                <header class="chat-thread-header"><button class="icon-button chat-back" type="button"
                        data-action="chat-back" aria-label="Back to conversations">←</button><span
                        class="avatar"></span>
                    <div><strong></strong><span></span></div>
                </header>
                <div class="chat-message-list" data-chat-message-list></div>
                <form class="chat-compose" data-chat-form><textarea name="message" rows="1" maxlength="1000"
                        placeholder="Write a message..." aria-label="Write a message" required></textarea><button
                        class="button button-primary" type="submit">Send</button></form>
            </section>
        </main>


        <aside class="right-rail">
            <label class="search-box"><span>⌕</span><input type="search" placeholder="Search by name or username"
                    aria-label="Search people and communities" data-search-input><kbd>/</kbd></label>
            <div class="right-section search-results hidden" data-search-results></div>
            <section class="community-prompt"><span class="prompt-spark">✳</span>
                <h2>A little note goes a long way.</h2>
                <p>Keep the good conversations going, one message at a time.</p><a class="button button-light"
                    href="community.html">Find your people</a>
            </section>
            <footer class="site-footer"><a data-footer-link="about" href="#">About</a><a data-footer-link="guidelines"
                    href="#">Guidelines</a><a data-footer-link="privacy" href="#">Privacy</a><span
                    data-footer-copy></span></footer>
        </aside>

    </div>


    <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="home.html" aria-label="Home"><i class="fa-solid fa-house"></i></a>
        <a href="explore.html" aria-label="Explore"><i class="fa-brands fa-sistrix"></i></a>
        <a href="notifications.html" aria-label="Notifications"><i class="fa-regular fa-bell"></i></a>
    </nav>
</body>

</html>
