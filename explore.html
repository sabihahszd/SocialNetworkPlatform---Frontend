<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f7">
  <title>Explore — Gather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/explore.css">
  <script src="assets/js/shared.js" defer></script>
  <script src="assets/js/explore.js" defer></script>
</head>

<body data-page="explore">
  <header class="mobile-header"><a class="brand" href="index.html"><span class="brand-mark"></span><span
        class="brand-word"></span></a><a class="avatar avatar-small" href="profile.html"></a></header>
  <div class="app-shell">
    <aside class="left-rail"><a class="brand" href="index.html"><span class="brand-mark"></span><span
          class="brand-word"></span></a>
      <nav class="primary-nav" aria-label="Main navigation"><a class="nav-link" href="index.html"><span
            class="nav-icon"><i class="fa-solid fa-house"></i></span>Home</a><a class="nav-link active"
          href="explore.html"><span class="nav-icon"><i class="fa-brands fa-sistrix"></i></span>Explore</a><a
          class="nav-link" href="community.html"><span class="nav-icon"><i
              class="fa-solid fa-users"></i></span>Community</a><a class="nav-link" href="chats.html"><span
            class="nav-icon"><i class="fa-regular fa-comments"></i></span>Chats</a><a class="nav-link"
          href="bookmarks.html"><span class="nav-icon"><i class="fa-regular fa-bookmark"></i></span>Bookmarks</a><a
          class="nav-link" href="notifications.html"><span class="nav-icon"><i
              class="fa-regular fa-bell"></i></span>Notifications<span class="nav-badge"
            data-notification-count></span></a><a class="nav-link" href="profile.html"><span class="nav-icon"><i
              class="fa-regular fa-user"></i></span>Profile</a><a class="nav-link" href="settings.html"><span
            class="nav-icon"><i class="fa-solid fa-gear"></i></span>Settings</a></nav>
      <div class="rail-divider"></div>
      <div class="rail-bottom">
        <div class="mini-profile"><a class="avatar" href="profile.html"></a><a class="profile-summary"
            href="profile.html"><strong></strong><span></span></a><button class="icon-button" data-action="account-menu"
            aria-label="Account options">···</button></div><a class="text-link" href="login.html">Switch account</a>
      </div>
    </aside>



    <main class="main-column">
      <div class="page-heading">
        <div>
          <h1>Explore</h1>
        </div>
      </div><label class="search-box explore-search"><span>⌕</span><input type="search"
          placeholder="Search by name or username" aria-label="Search people and communities"
          data-search-input><kbd>/</kbd></label>
      <div class="right-section search-results explore-results hidden" data-search-results></div>
      <section class="explore-section">
        <div class="section-title">
          <div>
            <h2>People to know</h2>
          </div>
        </div>
        <div class="people-grid" data-people-grid></div>
      </section>
      <section class="explore-section" id="circles">
        <div class="section-title">
          <div>
            <h2>Communities to join</h2>
          </div>
        </div>
        <div class="community-grid" data-community-grid></div>
      </section>
      <section class="explore-section">
        <div class="section-title">
          <div>
            <h2>Across your communities</h2>
          </div>
        </div>
        <div class="feed-list" data-feed-list></div>
      </section>
    </main>



    <aside class="right-rail"><label class="search-box"><span>⌕</span><input type="search"
          placeholder="Search by name or username" aria-label="Search people and communities"
          data-search-input><kbd>/</kbd></label>
      <div class="right-section search-results hidden" data-search-results></div>
      <section class="right-section trends-section">
        <div class="section-title">
          <h2>Growing communities</h2><a href="community.html">See all</a>
        </div>
        <div data-trending-circles></div>
      </section>
      <section class="community-prompt"><span class="prompt-spark">✳</span>
        <h2>Your people are out there.</h2>
        <p>Make a little room for a conversation you didn’t know you needed.</p><button class="button button-light"
          data-action="new-community">Start a community</button>
      </section>
      <footer class="site-footer"><a data-footer-link="about" href="#">About</a><a data-footer-link="guidelines"
          href="#">Guidelines</a><a data-footer-link="privacy" href="#">Privacy</a><span data-footer-copy></span>
      </footer>
    </aside>



  </div>



  <nav class="mobile-nav" aria-label="Mobile navigation"><a href="index.html" aria-label="Home"><i
        class="fa-regular fa-house"></i></a><a class="active" href="explore.html" aria-label="Explore"><i
        class="fa-brands fa-sistrix"></i></a><a href="notifications.html" aria-label="Notifications"><i
        class="fa-regular fa-bell"></i></a><a href="profile.html" aria-label="Profile"><i
        class="fa-regular fa-user"></i></a></nav>
</body>

</html>
